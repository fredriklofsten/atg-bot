name: ATG-boten
on:
  schedule:
    # Tre vaktpass per dag (svensk vintertid). Varje pass kollar odds varje minut i 4,5 timmar.
    - cron: "40 8 * * *"    # 09:40
    - cron: "10 13 * * *"   # 14:10
    - cron: "40 17 * * *"   # 18:40
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: atg-boten
  cancel-in-progress: false
jobs:
  kor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Europe/Stockholm
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NTFY_AMNE: ${{ secrets.NTFY_AMNE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # alltid senaste versionen, även om körningen stått i kö
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git-identitet och senaste data
        run: |
          git pull -q --ff-only origin main
          git config user.name "atg-boten"
          git config user.email "atg-boten@users.noreply.github.com"
      - name: Måndag förmiddag – lär om och låt AI-forskaren testa veckans idé
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" -lt 12 ]; then
            python bot.py veckotraning
            python bot.py forska planera
            python bot.py forska kor
            python bot.py trana
          fi
      - name: Vakta loppen
        run: python bot.py vakt --timmar 4.5
      - name: Spara resultat
        if: always()
        run: |
          git add -A
          git commit -q -m "Körning $(date '+%F %H:%M')" || exit 0
          git pull -q --rebase -X theirs
          git push -q
      - name: Larma om något gick fel
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titel = `ATG-boten kraschade ${new Date().toISOString().slice(0, 10)}`;
            const finns = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open"});
            if (finns.data.some(i => i.title === titel)) return;   // max ett larm per dag
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: titel,
              body: `En körning misslyckades, så appen uppdaterades inte.\n\nSe felet här: ${url}\n\nSkicka länken till Claude så fixar vi det.`});
